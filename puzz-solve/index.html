<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>8 Puzzle Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ------------------ GLOBAL ------------------ */
body {
    font-family: "Segoe UI", sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ------------------ GAME CARD ------------------ */
.game-container {
    background: #ffffff;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    text-align: center;
    width: 320px;
}

h1 {
    margin-bottom: 12px;
    font-weight: 600;
}

/* ------------------ BOARD ------------------ */
.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0;
}

/* ------------------ TILES ------------------ */
.tile {
    height: 80px;
    border-radius: 12px;
    background: #e8ecf1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
}

.tile:hover {
    background: #dfe4ea;
    transform: scale(1.05);
}

.tile.empty {
    background: transparent;
    cursor: default;
}

/* ------------------ FOOTER ------------------ */
.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: #fff;
    font-weight: 500;
    cursor: pointer;
}

button:hover {
    background: #4338ca;
}

.win {
    margin-top: 12px;
    color: #16a34a;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="game-container">
    <h1>8 Puzzle</h1>

    <div class="board" id="board"></div>

    <div class="info">
        <span>Moves: <strong id="moves">0</strong></span>
        <button onclick="resetGame()">Restart</button>
    </div>

    <div class="win" id="winMessage"></div>
</div>

<script>
/* ------------------ GAME STATE ------------------ */
const boardElement = document.getElementById("board");
const movesElement = document.getElementById("moves");
const winMessage = document.getElementById("winMessage");

let board = [];
let moves = 0;

const GOAL = [1,2,3,4,5,6,7,8,0];

/* ------------------ INITIALIZE ------------------ */
function initGame() {
    board = generateSolvableBoard();
    moves = 0;
    movesElement.textContent = moves;
    winMessage.textContent = "";
    renderBoard();
}

/* ------------------ RENDER ------------------ */
function renderBoard() {
    boardElement.innerHTML = "";

    board.forEach((value, index) => {
        const tile = document.createElement("div");
        tile.classList.add("tile");

        if (value === 0) {
            tile.classList.add("empty");
        } else {
            tile.textContent = value;
            tile.addEventListener("click", () => moveTile(index));
        }

        boardElement.appendChild(tile);
    });
}

/* ------------------ MOVE LOGIC ------------------ */
function moveTile(index) {
    const emptyIndex = board.indexOf(0);

    if (!isAdjacent(index, emptyIndex)) return;

    // Swap tile with empty
    [board[index], board[emptyIndex]] = [board[emptyIndex], board[index]];

    moves++;
    movesElement.textContent = moves;
    renderBoard();

    if (checkWin()) {
        winMessage.textContent = "🎉 Puzzle Solved!";
    }
}

/* ------------------ ADJACENCY CHECK ------------------ */
function isAdjacent(i, j) {
    const row1 = Math.floor(i / 3);
    const col1 = i % 3;
    const row2 = Math.floor(j / 3);
    const col2 = j % 3;

    return Math.abs(row1 - row2) + Math.abs(col1 - col2) === 1;
}

/* ------------------ WIN CHECK ------------------ */
function checkWin() {
    return board.every((val, idx) => val === GOAL[idx]);
}

/* ------------------ SHUFFLE (SOLVABLE) ------------------ */
function generateSolvableBoard() {
    let arr;
    do {
        arr = shuffle([...GOAL]);
    } while (!isSolvable(arr) || isSolved(arr));
    return arr;
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

/* ------------------ SOLVABILITY ------------------ */
function isSolvable(arr) {
    let inversions = 0;

    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] && arr[j] && arr[i] > arr[j]) {
                inversions++;
            }
        }
    }
    return inversions % 2 === 0;
}

function isSolved(arr) {
    return arr.every((v, i) => v === GOAL[i]);
}

/* ------------------ RESET ------------------ */
function resetGame() {
    initGame();
}

/* ------------------ START ------------------ */
initGame();
</script>

</body>
</html>
